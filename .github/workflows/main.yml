name: Lwjgl3 Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up JDK 21
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JRE JAR files
        run: |
          gradle :jre_lwjgl3glfw:build
    
      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: lwjgl
          path: lwjgl3/*
